limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # Docker's embedded resolver avoids stale backend addresses after a container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /healthz { proxy_pass $backend/actuator/health; }
    location = /version.json { add_header Cache-Control no-store; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
