# Explicit local-only convenience profile. Deployment uses PostgreSQL.
spring.datasource.url=jdbc:h2:file:./.local/todo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
app.jwt.secret=local-only-do-not-deploy-this-signing-key-2026
app.cookie-secure=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
