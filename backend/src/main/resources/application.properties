spring.application.name=Todo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo}
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.shutdown=graceful
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.version=${APP_VERSION:local}
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=todo-api
app.jwt.audience=todo-web
app.cookie-secure=${COOKIE_SECURE:true}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
