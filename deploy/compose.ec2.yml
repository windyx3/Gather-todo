name: todo
services:
  postgres:
    profiles: ["database"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    image: ${ECR_REGISTRY:?}/todo-backend:${IMAGE_TAG:?}
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/todo}
      DB_USER: ${DB_USER:-todo}
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@qq.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the deployment configuration}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_VERSION: ${IMAGE_TAG}
      ALLOWED_ORIGINS: http://localhost:8088
    volumes:
      - /opt/todo/certs:/certs:ro
    restart: unless-stopped
    logging: *logging
  frontend:
    image: ${ECR_REGISTRY:?}/todo-frontend:${IMAGE_TAG:?}
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
volumes:
  postgres_data:
    name: todo_postgres_data
